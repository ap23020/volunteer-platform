<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Reviews</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Reviews</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/review/list}" method="get" class="row g-3 mb-4 align-items-end">
            <div class="col-md-4">
                <label class="form-label text-white-50 small">Event</label>
                <select class="form-select form-select-sm" name="eventId">
                    <option value="">All Events</option>
                    <option th:each="e : ${events}"
                            th:value="${e.id}"
                            th:text="${e.title + ' | ' + (e.dateTime != null ? #temporals.format(e.dateTime, 'dd/MM/yyyy') : 'N/A')}"
                            th:selected="${e.id == selectedEventId}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label text-white-50 small">Rating</label>
                <select class="form-select form-select-sm" name="rating">
                    <option value="">All Ratings</option>
                    <option th:each="r : ${ratings}"
                            th:value="${r}"
                            th:text="${r + ' stars'}"
                            th:selected="${r == selectedRating}"></option>
                </select>
            </div>

            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-filter flex-fill">Filter</button>
                <a th:href="@{/review/list}" class="btn btn-sm btn-clear flex-fill">Clear</a>
            </div>
        </form>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Rating</th>
                <th>Comment</th>
                <th>Event</th>
                <th>Volunteer</th>
                <th>Submitted At</th>
                <th sec:authorize="hasRole('ROLE_ADMIN')">Hidden</th>
                <th sec:authorize="hasRole('ROLE_ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reviews}">
                <td>
        <span th:each="i : ${#numbers.sequence(1, 5)}"
              th:text="${i <= r.rating ? '★' : '☆'}"
              th:classappend="${i <= r.rating ? 'text-warning' : 'text-muted'}"></span>
                    <span class="ms-1 text-white-50" th:text="'(' + ${r.rating} + ')'"></span>
                </td>
                <td th:text="${r.comment}"></td>
                <td th:text="${r.participation?.event?.title} ?: '-'"></td>
                <td th:text="${r.participation?.volunteer?.firstName + ' ' + r.participation?.volunteer?.lastName} ?: '-'"></td>
                <td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>

                <!-- Hidden: μόνο για admin -->
                <td sec:authorize="hasRole('ROLE_ADMIN')" th:text="${r.hidden ? 'Yes' : 'No'}"></td>

                <!-- Actions: μόνο για admin -->
                <td sec:authorize="hasRole('ROLE_ADMIN')">
                    <div class="d-flex gap-2">
                        <form th:if="${!r.hidden}"
                              th:action="@{/admin/reviews/hide/{id}(id=${r.id})}" method="post">
                            <button type="submit" class="btn btn-warning btn-sm">Hide</button>
                        </form>
                        <form th:if="${r.hidden}"
                              th:action="@{/admin/reviews/unhide/{id}(id=${r.id})}" method="post">
                            <button type="submit" class="btn btn-info btn-sm">Unhide</button>
                        </form>
                        <form th:action="@{/admin/reviews/delete/{id}(id=${r.id})}" method="post"
                              onsubmit="return confirm('Delete this review?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(reviews)}" class="mt-3">
            <p>No reviews yet.</p>
        </div>
    </div>
</div>
</body>
</html>
