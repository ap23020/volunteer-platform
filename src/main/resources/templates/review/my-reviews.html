<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>My Reviews</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">My Reviews</h2>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Event</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Submitted At</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reviews}">
                <td th:text="${r.participation?.event?.title} ?: '-'"></td>
                <td>
    <span th:each="i : ${#numbers.sequence(1, 5)}"
          th:text="${i <= r.rating ? '★' : '☆'}"
          th:classappend="${i <= r.rating ? 'text-warning' : 'text-muted'}"></span>
                    <span class="ms-1 text-white-50" th:text="'(' + ${r.rating} + ')'"></span>
                </td>
                <td th:text="${r.comment}"></td>
                <td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(reviews)}" class="mt-3">
            <p>You have not submitted any reviews yet.</p>
        </div>
    </div>
</div>
</body>
</html>
