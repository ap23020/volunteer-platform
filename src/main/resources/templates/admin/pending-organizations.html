<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Pending Organizations</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Pending Organization Approvals</h2>

        <!-- Μήνυμα επιτυχίας/λάθους αν υπάρχει -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Website</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="org : ${organizations}">
                <td th:text="${org.id}"></td>
                <td th:text="${org.name}"></td>
                <td th:text="${org.description}"></td>
                <td>
                    <a th:if="${org.website}" th:href="${org.website}" th:text="${org.website}" target="_blank"></a>
                    <span th:unless="${org.website}">-</span>
                </td>
                <td th:text="${org.phone ?: '-'}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <!-- Έγκριση -->
                        <form th:action="@{/admin/organizations/approve/{id}(id=${org.id})}"
                              method="post">
                            <button type="submit" class="btn btn-success btn-sm">Approve</button>
                        </form>

                        <!-- Απόρριψη με προαιρετική αιτιολογία -->
                        <form th:action="@{/admin/organizations/reject/{id}(id=${org.id})}"
                              method="post"
                              class="d-flex gap-2"
                              onsubmit="return confirm('Reject this organization?');">
                            <input type="text" name="reason" placeholder="Reason" class="form-control form-control-sm" style="width: 150px;">
                            <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Αν δεν υπάρχουν εκκρεμείς οργανισμοί -->
        <div th:if="${#lists.isEmpty(organizations)}" class="mt-3">
            <p>No pending organizations.</p>
        </div>
    </div>
</div>
</body>
</html>
