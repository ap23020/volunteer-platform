<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Pending Events</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Pending Event Approvals</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Organization</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}"></td>
                <td th:text="${event.title}"></td>
                <td th:text="${event.organization.name}"></td>
                <td th:text="${event.dateTime != null ? #temporals.format(event.dateTime, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <form th:action="@{/admin/events/approve/{id}(id=${event.id})}" method="post">
                            <button type="submit" class="btn btn-success btn-sm">Approve</button>
                        </form>
                        <form th:action="@{/admin/events/reject/{id}(id=${event.id})}" method="post" class="d-flex gap-2">
                            <input type="text" name="comment" placeholder="Comment" class="form-control form-control-sm" style="width: 150px;">
                            <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
