<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Notifications</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Notifications</h2>

        <!-- Πίνακας ειδοποιήσεων -->
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Title</th>
                <th>Message</th>
                <th>Created At</th>
                <th>Related Event</th>
            </tr>
            </thead>
            <tbody>
            <!-- Χρησιμοποιούμε notificationPage.content αντί για notifications -->
            <tr th:each="n : ${notificationPage.content}">
                <td th:text="${n.id}"></td>
                <td th:text="${n.type}"></td>
                <td th:text="${n.title}"></td>
                <td th:text="${n.message}"></td>
                <td th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td th:text="${n.relatedEvent != null ? n.relatedEvent.title : '-'}"></td>
            </tr>
            </tbody>
        </table>

        <!-- Μήνυμα αν δεν υπάρχουν ειδοποιήσεις -->
        <div th:if="${notificationPage.totalElements == 0}" class="mt-3">
            <p>No notifications yet.</p>
        </div>

        <!-- Pagination controls – εμφανίζονται μόνο αν υπάρχουν πάνω από μία σελίδες -->
        <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/notifications/list(page=${currentPage - 1}, size=10)}">Previous</a>
                </li>

                <li class="page-item disabled">
                    <span class="page-link" th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${totalPages}"></span>
                </li>

                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/notifications/list(page=${currentPage + 1}, size=10)}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
