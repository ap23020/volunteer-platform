<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Notifications</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Notifications</h2>
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Title</th>
                <th>Message</th>
                <th>Created At</th>
                <th>Related Event</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notifications}">
                <td th:text="${n.id}"></td>
                <td th:text="${n.type}"></td>
                <td th:text="${n.title}"></td>
                <td th:text="${n.message}"></td>
                <td th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td th:text="${n.relatedEvent != null ? n.relatedEvent.title : '-'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
