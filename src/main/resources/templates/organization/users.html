<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
  <title>Organization Users</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
  <div class="container py-5">
    <h2 class="mb-4">Organization Users</h2>

    <table class="table table-striped table-bordered">
      <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Organization</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${organizationUsers}">
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.organization.name}"></td>
        <td>
          <form th:action="@{/organization/users/delete/{id}(id=${user.id})}"
                method="post"
                onsubmit="return confirm('Delete this user?');">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <div th:if="${#lists.isEmpty(organizationUsers)}">
      <p>No organization users yet.</p>
    </div>
  </div>
</div>
</body>
</html>
