<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
  <title>Register Organization</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4">Register Organization</h2>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/organization/register}" th:object="${organization}" method="post">
          <div class="mb-3">
            <label class="form-label">Organization Name</label>
            <input type="text" class="form-control" th:field="*{name}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Website</label>
            <input type="text" class="form-control" th:field="*{website}">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phone}">
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
          <a th:href="@{/organization/list}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
