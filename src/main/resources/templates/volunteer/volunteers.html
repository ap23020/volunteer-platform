<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Volunteers</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Volunteers</h2>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Skills</th>
                <th>Interests</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="volunteer : ${volunteerPage.content}">
                <td th:text="${volunteer.id}"></td>
                <td th:text="${volunteer.firstName}"></td>
                <td th:text="${volunteer.lastName}"></td>
                <td th:text="${volunteer.email}"></td>
                <td th:text="${volunteer.skills}"></td>
                <td th:text="${volunteer.interests}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <a th:href="@{/participation/volunteer/{id}(id=${volunteer.id})}"
                           class="btn btn-info btn-sm">View Participations</a>

                        <form th:action="@{/volunteer/delete/{id}(id=${volunteer.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this volunteer?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Μήνυμα όταν δεν υπάρχουν εθελοντές -->
        <div th:if="${volunteerPage.totalElements == 0}" class="mt-3">
            <p>No volunteers yet.</p>
        </div>

        <!-- Pagination controls – εμφανίζονται μόνο αν υπάρχουν πάνω από μία σελίδες -->
        <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/volunteer/list(page=${currentPage - 1}, size=10)}">Previous</a>
                </li>

                <li class="page-item disabled">
                    <span class="page-link" th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${totalPages}"></span>
                </li>

                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/volunteer/list(page=${currentPage + 1}, size=10)}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
