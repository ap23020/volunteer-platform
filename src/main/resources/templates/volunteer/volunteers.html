<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Λίστα Εθελοντών</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Volunteers</h2>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Skills</th>
                <th>Interests</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="volunteer : ${volunteers}">
                <td th:text="${volunteer.id}"></td>
                <td th:text="${volunteer.firstName}"></td>
                <td th:text="${volunteer.lastName}"></td>
                <td th:text="${volunteer.email}"></td>
                <td th:text="${volunteer.skills}"></td>
                <td th:text="${volunteer.interests}"></td>
                <td>
                    <a th:href="@{/participation/volunteer/{id}(id=${volunteer.id})}"
                       class="btn btn-info btn-sm">View Participations</a>

                    <form th:action="@{/volunteer/delete/{id}(id=${volunteer.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this volunteer?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(volunteers)}">
            <p>No volunteers yet.</p>
        </div>
    </div>
</div>
</body>
</html>
