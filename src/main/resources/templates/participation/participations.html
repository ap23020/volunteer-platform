<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Participations</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <div class="mb-4">
            <h2>Participations</h2>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- ΦΙΛΤΡΟ -->
        <form th:action="@{/participation/list}" method="get" class="row g-3 mb-4 align-items-end">
            <div class="col-md-5">
                <label class="form-label text-white-50 small">Event</label>
                <select class="form-select form-select-sm" name="eventId">
                    <option value="">All Events</option>
                    <option th:each="e : ${events}"
                            th:value="${e.id}"
                            th:text="${e.title + ' | ' + (e.dateTime != null ? #temporals.format(e.dateTime, 'dd/MM/yyyy') : 'N/A')}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label text-white-50 small">Status</label>
                <select class="form-select form-select-sm" name="status">
                    <option value="">All Statuses</option>
                    <option th:each="s : ${statuses}"
                            th:value="${s.name()}"
                            th:text="${s}"
                            th:selected="${s == selectedStatus}"></option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-filter flex-fill">Filter</button>
                <a th:href="@{/participation/list}" class="btn btn-sm btn-clear flex-fill">Clear</a>
                <a th:href="@{/participation/export}" class="btn btn-sm btn-clear">Export CSV</a>
            </div>
        </form>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Volunteer</th>
                <th>Event</th>
                <th>Status</th>
                <th>Submitted At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${participations}">
                <td th:text="${p.volunteer.firstName + ' ' + p.volunteer.lastName}"></td>
                <td th:text="${p.event.title}"></td>
                <td th:text="${p.status}"></td>
                <td th:text="${p.createdAt != null ? #temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td>
                    <div class="d-flex gap-2 flex-wrap">
                        <!-- Ενέργειες για ORGANIZATION και ADMIN -->
                        <div sec:authorize="hasAnyRole('ROLE_ORGANIZATION','ROLE_ADMIN')" class="d-flex gap-2">
                            <form th:if="${p.status == T(gr.hua.dit.ap.vmp.entities.ParticipationStatus).PENDING_ORG_APPROVAL}"
                                  th:action="@{/participation/approve/{id}(id=${p.id})}" method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-success btn-sm">Approve</button>
                            </form>

                            <form th:if="${p.status == T(gr.hua.dit.ap.vmp.entities.ParticipationStatus).PENDING_ORG_APPROVAL}"
                                  th:action="@{/participation/reject/{id}(id=${p.id})}" method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                            </form>

                            <form th:if="${p.status == T(gr.hua.dit.ap.vmp.entities.ParticipationStatus).APPROVED}"
                                  th:action="@{/participation/checkin/{id}(id=${p.id})}" method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-info btn-sm">Check-in</button>
                            </form>
                        </div>

                        <!-- Ενέργειες για VOLUNTEER -->
                        <div sec:authorize="hasRole('ROLE_VOLUNTEER')" class="d-flex gap-2">
                            <form th:if="${p.status == T(gr.hua.dit.ap.vmp.entities.ParticipationStatus).APPROVED}"
                                  th:action="@{/participation/cancel/{id}(id=${p.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Cancel this participation?');">
                                <button type="submit" class="btn btn-warning btn-sm">Cancel</button>
                            </form>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
