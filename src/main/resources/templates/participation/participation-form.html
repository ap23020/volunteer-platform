<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Apply for Event</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4">Apply for Event</h2>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/participation/new}" method="post">
            <!-- Επιλογή εθελοντή για ΜΗ-εθελοντές (π.χ. admin) -->
            <div class="mb-3" sec:authorize="!hasRole('ROLE_VOLUNTEER')">
                <label class="form-label">Volunteer</label>
                <select class="form-control" name="volunteerId" required>
                    <option value="">Select Volunteer</option>
                    <option th:each="v : ${volunteers}"
                            th:value="${v.id}"
                            th:text="${v.firstName + ' ' + v.lastName}"></option>
                </select>
            </div>

            <!-- Για εθελοντή: εμφανίζουμε το όνομά του και κρυφό πεδίο -->
            <div class="mb-3" sec:authorize="hasRole('ROLE_VOLUNTEER')">
                <label class="form-label">Volunteer</label>
                <input type="text" class="form-control"
                       th:value="${currentVolunteer != null ? currentVolunteer.firstName + ' ' + currentVolunteer.lastName : ''}"
                       disabled>
                <input type="hidden" name="volunteerId" th:value="${currentVolunteer != null ? currentVolunteer.id : ''}">
            </div>

            <!-- Εμφάνιση επιλεγμένου event (κλειδωμένο) -->
            <div class="mb-3">
                <label class="form-label">Event</label>
                <input type="text" class="form-control" th:value="${selectedEvent.title}" disabled>
                <input type="hidden" name="eventId" th:value="${selectedEvent.id}">
            </div>

            <button type="submit" class="btn btn-primary">Submit Application</button>
            <a th:href="@{/event/list}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
