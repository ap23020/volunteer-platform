<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Event Form</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <h2 class="mb-4" th:text="${event.id == null ? 'Create New Event' : 'Edit Event'}">Event Form</h2>

        <!-- Μήνυμα λάθους (αν υπάρχει) -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Φόρμα που αλλάζει action ανάλογα αν είναι δημιουργία ή επεξεργασία -->
        <form th:action="${event.id == null} ? @{/event/new} : @{/event/edit/{id}(id=${event.id})}"
              th:object="${event}" method="post">

            <!-- Hidden field για id όταν κάνουμε edit -->
            <input type="hidden" th:field="*{id}" th:if="${event.id != null}">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" th:field="*{title}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date & Time</label>
                    <input type="datetime-local" id="dateTimeInput" class="form-control" th:field="*{dateTime}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Duration (hours)</label>
                    <input type="number" class="form-control" th:field="*{duration}" min="1">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" th:field="*{location}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Max Participants</label>
                    <input type="number" class="form-control" th:field="*{maxParticipants}" min="1">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-control" th:field="*{category}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Organization</label>
                <select class="form-control" th:field="*{organization.id}" required>
                    <option value="">Select Organization</option>
                    <option th:each="org : ${organizations}"
                            th:value="${org.id}"
                            th:text="${org.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"
                    th:text="${event.id == null ? 'Create Event' : 'Update Event'}">Create Event</button>
            <a th:href="@{/event/list}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<script>
    // Περιορισμός ημερομηνίας ώστε να μην επιλέγεται προγενέστερη
    (function() {
        const input = document.getElementById('dateTimeInput');
        if (input) {
            const now = new Date();
            const localNow = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                .toISOString()
                .slice(0, 16);
            input.setAttribute('min', localNow);
        }
    })();
</script>
</body>
</html>
