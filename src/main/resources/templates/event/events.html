<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Events</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Events</h2>
            <a th:href="@{/event/new}" class="btn btn-primary">Create Event</a>
        </div>

        <!-- Εμφάνιση μηνυμάτων επιτυχίας/λάθους -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>Location</th>
                <th>Status</th>
                <th>Admin Comment</th>
                <th>Organization</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}"></td>
                <td th:text="${event.title}"></td>
                <td th:text="${event.dateTime != null ? #temporals.format(event.dateTime, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td th:text="${event.location}"></td>
                <td th:text="${event.status}"></td>
                <td>
                    <span th:if="${event.status.name() == 'REJECTED'}" th:text="${event.adminComment}"></span>
                    <span th:unless="${event.status.name() == 'REJECTED'}">-</span>
                </td>
                <td th:text="${event.organization.name}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <!-- Edit – μόνο για απορριφθείσες εκδηλώσεις -->
                        <a th:if="${event.status.name() == 'REJECTED'}"
                           th:href="@{/event/edit/{id}(id=${event.id})}"
                           class="btn btn-warning btn-sm">Edit</a>

                        <!-- View Participations -->
                        <a th:href="@{/participation/event/{id}(id=${event.id})}"
                           class="btn btn-info btn-sm">View</a>

                        <a th:if="${event.status.name() == 'APPROVED'}"
                           th:href="@{/participation/new(eventId=${event.id})}"
                           class="btn btn-success btn-sm">Apply</a>

                        <!-- Cancel Event – μόνο για εγκεκριμένες εκδηλώσεις -->
                        <form th:if="${event.status.name() == 'APPROVED'}"
                              th:action="@{/event/cancel/{id}(id=${event.id})}"
                              method="post"
                              onsubmit="return confirm('Cancel this event? All participants will be notified.');">
                            <button type="submit" class="btn btn-warning btn-sm">Cancel</button>

                        </form>

                        <!-- Delete – πάντα διαθέσιμο -->
                        <form th:action="@{/event/delete/{id}(id=${event.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this event?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
