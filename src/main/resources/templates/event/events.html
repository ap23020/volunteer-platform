<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Events</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Events</h2>
            <a th:href="@{/event/new}" class="btn btn-primary">Create Event</a>
        </div>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>Location</th>
                <th>Status</th>
                <th>Admin Comment</th>
                <th>Organization</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}"></td>
                <td th:text="${event.title}"></td>
                <td th:text="${event.dateTime != null ? #temporals.format(event.dateTime, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td th:text="${event.location}"></td>
                <td th:text="${event.status}"></td>
                <td>
                <span th:if="${event.status == T(gr.hua.dit.ap.vmp.entities.EventStatus).REJECTED}"
                      th:text="${event.adminComment}"></span>
                    <span th:unless="${event.status == T(gr.hua.dit.ap.vmp.entities.EventStatus).REJECTED}">-</span>
                </td>
                <td th:text="${event.organization.name}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <a th:if="${event.status == T(gr.hua.dit.ap.vmp.entities.EventStatus).REJECTED}"
                           th:href="@{/event/edit/{id}(id=${event.id})}"
                           class="btn btn-warning btn-sm">Edit</a>

                        <form th:action="@{/event/delete/{id}(id=${event.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this event?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(events)}">
            <p>No events yet.</p>
        </div>
    </div>
</div>
</body>
</html>
