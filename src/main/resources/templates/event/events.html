<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.w3.org/1999/xhtml"
      layout:decorate="~{page_layout/layout}">
<head>
    <title>Events</title>
</head>
<body>
<div layout:fragment="main-content" class="d-flex flex-column h-100">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Events</h2>
            <a sec:authorize="hasAnyRole('ROLE_ORGANIZATION','ROLE_ADMIN')"
            <a th:href="@{/event/new}" class="btn btn-outline-light btn-sm">Create Event</a>
        </div>

        <!-- Εμφάνιση μηνυμάτων επιτυχίας/λάθους -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/event/list}" method="get" class="row g-3 mb-4 align-items-end">
            <!-- Φίλτρο οργανισμού: μόνο για admin -->
            <div class="col-md-4" sec:authorize="hasRole('ROLE_ADMIN')">
                <label class="form-label text-white-50 small">Organization</label>
                <select class="form-select form-select-sm" name="organizationId">
                    <option value="">All Organizations</option>
                    <option th:each="org : ${organizations}"
                            th:value="${org.id}"
                            th:text="${org.name}"
                            th:selected="${org.id == selectedOrganizationId}"></option>
                </select>
            </div>

            <!-- Φίλτρο κατάστασης: για όλους -->
            <div class="col-md-4" th:classappend="${#authorization.expression('hasRole(''ROLE_ADMIN'')') ? '' : 'col-md-6'}">
                <label class="form-label text-white-50 small">Status</label>
                <select class="form-select form-select-sm" name="status">
                    <option value="">All Statuses</option>
                    <option th:each="s : ${statuses}"
                            th:value="${s.name()}"
                            th:text="${s}"
                            th:selected="${s == selectedStatus}"></option>
                </select>
            </div>

            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-filter flex-fill">Filter</button>
                <a th:href="@{/event/list}" class="btn btn-sm btn-clear flex-fill">Clear</a>
            </div>
        </form>

        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Title</th>
                <th>Date</th>
                <th>Location</th>
                <th>Status</th>
                <th>Admin Comment</th>
                <th>Organization</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.title}"></td>
                <td th:text="${event.dateTime != null ? #temporals.format(event.dateTime, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td th:text="${event.location}"></td>
                <td th:text="${event.status}"></td>
                <td>
                    <span th:if="${event.status.name() == 'REJECTED'}" th:text="${event.adminComment}"></span>
                    <span th:unless="${event.status.name() == 'REJECTED'}">-</span>
                </td>
                <td th:text="${event.organization.name}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <!-- Edit – μόνο για απορριφθείσες εκδηλώσεις -->
                        <a th:if="${event.status.name() == 'REJECTED'}"
                           th:href="@{/event/edit/{id}(id=${event.id})}"
                           class="btn btn-warning btn-sm">Edit</a>

                        <!-- View Participations -->
                        <a sec:authorize="hasAnyRole('ROLE_ORGANIZATION','ROLE_ADMIN')"
                           th:href="@{/participation/event/{id}(id=${event.id})}"
                           class="btn btn-info btn-sm">View </a>

                        <a sec:authorize="hasRole('ROLE_VOLUNTEER')"
                            th:if="${event.status.name() == 'APPROVED' && !appliedEventIds.contains(event.id)}"
                            th:href="@{/participation/new(eventId=${event.id})}"
                            class="btn btn-success btn-sm">Apply</a>

                        <!-- Cancel Event – μόνο για εγκεκριμένες εκδηλώσεις -->
                        <form th:if="${event.status.name() == 'APPROVED'}"
                              th:action="@{/event/cancel/{id}(id=${event.id})}"
                              method="post"
                              onsubmit="return confirm('Cancel this event? All participants will be notified.');">
                            <button type="submit" class="btn btn-warning btn-sm">Cancel</button>

                        </form>

                        <!-- Delete: μόνο ORGANIZATION/ADMIN -->
                        <form sec:authorize="hasAnyRole('ROLE_ORGANIZATION','ROLE_ADMIN')"
                              th:action="@{/event/delete/{id}(id=${event.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this event?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
